<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Emergenza e risposta della community">
  <defs>
    <linearGradient id="s3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A8C4"/>
      <stop offset="1" stop-color="#003874"/>
    </linearGradient>
    <filter id="s3blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="s3grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="21"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#s3bg)"/>
  <g filter="url(#s3blur)" opacity=".8">
    <circle cx="180" cy="120" r="140" fill="#3DDCF7"/>
    <circle cx="700" cy="430" r="170" fill="#2E9B5B"/>
  </g>
  <!-- waves -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" opacity=".35">
    <path d="M-40 380c120-60 200 60 320 0s200 60 320 0 200 60 240 20"/>
    <path d="M-40 440c120-60 200 60 320 0s200 60 320 0 200 60 240 20"/>
  </g>
  <!-- boat -->
  <g fill="#FFFFFF" opacity=".9">
    <path d="M330 300h180l-30 44H360z"/>
    <rect x="410" y="190" width="8" height="110" rx="4"/>
    <path d="M418 200l70 70h-70z" opacity=".85"/>
  </g>
  <rect width="800" height="520" filter="url(#s3grain)" opacity=".05"/>
</svg>
