<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Community riunita attorno alla cultura">
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003874"/>
      <stop offset="1" stop-color="#8FDFEA"/>
    </linearGradient>
    <filter id="s2blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="s2grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#s2bg)"/>
  <g filter="url(#s2blur)" opacity=".85">
    <circle cx="660" cy="110" r="150" fill="#2E9B5B"/>
    <circle cx="150" cy="430" r="160" fill="#00A8C4"/>
    <circle cx="380" cy="260" r="120" fill="#FFFFFF" opacity=".55"/>
  </g>
  <g fill="#FFFFFF" opacity=".85">
    <path d="M120 240h120v160H120z" opacity=".55"/>
    <path d="M260 200h120v200H260z" opacity=".4"/>
    <path d="M400 250h120v150H400z" opacity=".55"/>
    <path d="M540 190h120v210H540z" opacity=".35"/>
  </g>
  <rect width="800" height="520" filter="url(#s2grain)" opacity=".05"/>
</svg>
